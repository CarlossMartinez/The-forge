x-lockdown: &lockdown
  read_only: true
  security_opt:
    - "no-new-privileges=true"

services: 
  postgres:
    image: "11notes/postgres:18"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_BACKUP_SCHEDULE: "0 3 * * *"
      POSTGRES_BACKUP_RETENTION: 5
    ports:
      - "5432:5432/tcp"
      - "9090:9187/tcp"
    networks:
      - suite-dnd
    volumes:
      - postgres.etc:/postgres/etc
      - postgres.var:/postgres/var
      - postgres.backup:/postgres/backup
    tmpfs:
      - "/postgres/run:uid=1000,gid=1000"
      - "/postgres/log:uid=1000,gid=1000"
    restart: always
    
  the-forge:
    build:
      context: C:/Users/Charl/Desktop/The-forge/the-forge
      dockerfile: C:/Users/Charl/Desktop/The-forge/the-forge/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - C:/Users/Charl/Desktop/The-forge/the-forge:/the-forge
      - /the-forge/node_modules
    networks:
      - suite-dnd
    restart: always

  back-forge:
    build:
      context: ../back-forge
      dockerfile: ../docker/back-forge/Dockerfile
    volumes:
      - ../back-forge:/back-forge
    ports:
      - "9000:9000"
    command: ["php-fpm"]
    networks:
      - suite-dnd
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "900:80"
    volumes:
      - ../back-forge:/back-forge
      - ./back-forge/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - back-forge
    networks:
      - suite-dnd
      
volumes:
  postgres.etc:
  postgres.var:
  postgres.backup:

networks:
  suite-dnd:
